      ros2-pal-statistics ros2-tf2-ros-py ros2-ros2lifecycle-test-fixtures ros2-diagnostic-updater
      ros2-rosbag2-test-common ros2-sros2 ros2-ros2component
    runs-on: macos-15
    strategy:
      fail-fast: false
    needs: []
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0
      with:
        pixi-version: latest
        cache: 'true'
        log-level: v
        frozen: 'true'
    - name: Build ros2-realtime-tools ros2-generate-parameter-library ros2-message-filters
        ros2-pal-statistics ros2-tf2-ros-py ros2-ros2lifecycle-test-fixtures ros2-diagnostic-updater
        ros2-rosbag2-test-common ros2-sros2 ros2-ros2component
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros2-realtime-tools ros2-generate-parameter-library ros2-message-filters
          ros2-pal-statistics ros2-tf2-ros-py ros2-ros2lifecycle-test-fixtures ros2-diagnostic-updater
          ros2-rosbag2-test-common ros2-sros2 ros2-ros2component
        BUILD_TARGET: osx-arm64
      run: |
        export CI=github
        export GIT_BRANCH=${GITHUB_REF_NAME}
        export FEEDSTOCK_NAME=${GITHUB_REPOSITORY##*/}
        .scripts/build_unix.sh --target $BUILD_TARGET
    permissions:
      id-token: write
