      ros2-point-cloud-transport ros2-image-transport ros2-autoware-internal-msgs
      ros2-autoware-component-interface-specs ros2-rqt-py-common
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
    needs: []
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0
      with:
        pixi-version: latest
        cache: 'true'
        log-level: v
        frozen: 'true'
    - name: Build ros2-joint-limits ros2-tf2-ros ros2-ros2lifecycle ros2-rosbag2-storage
        ros2-rviz-rendering-tests ros2-point-cloud-transport ros2-image-transport
        ros2-autoware-internal-msgs ros2-autoware-component-interface-specs ros2-rqt-py-common
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        CURRENT_RECIPES: ros2-joint-limits ros2-tf2-ros ros2-ros2lifecycle ros2-rosbag2-storage
          ros2-rviz-rendering-tests ros2-point-cloud-transport ros2-image-transport
          ros2-autoware-internal-msgs ros2-autoware-component-interface-specs ros2-rqt-py-common
        BUILD_TARGET: linux-aarch64
      run: |
        export CI=github
        export GIT_BRANCH=${GITHUB_REF_NAME}
        export FEEDSTOCK_NAME=${GITHUB_REPOSITORY##*/}
        .scripts/build_unix.sh --target $BUILD_TARGET
