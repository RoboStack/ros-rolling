ros_distro: rolling

package_name_mode: both

# mapping for package keys
conda_index:
  - robostack.yaml
  - packages-ignore.yaml

# Reminder for next full rebuild, the next build number should be 27
build_number: 25

mutex_package:
  name: "ros2-distro-mutex"
  version: "0.20.0"
  # Bumped independently of build_number so the mutex is re-published with the new
  # run_constraints while already-built packages (ros2-distro-mutex 0.20.* rolling_*) stay valid.
  build_number: 26
  upper_bound: "x.x"
  run_constraints:
    - libboost 1.90.*
    - libboost-devel 1.90.*
    - pcl 1.15.1.*
    - gazebo 11.*
    - libprotobuf 7.35.1.*
    - vtk 9.7.0.*

packages_skip_by_deps:
  - rplidar_ros
  - rviz_visual_tools

  # libpointmatcher not yet released for rolling; rtabmap builds fine without
  # it (WITH_POINTMATCHER just disables the optional dependent feature).
  - libpointmatcher

  - if: not linux
    then:
      - pendulum_control
      - rttest
      - tlsf
      - tlsf_cpp

  # mujoco_vendor has no prebuilt MuJoCo binary for macOS, so mujoco_3d_lidar (which
  # calls real MuJoCo API functions, unlike mujoco_ros2_control) can't build there;
  # mujoco_ros2_control_plugins pulls it in transitively.
  - if: osx
    then:
      - mujoco_3d_lidar
      - mujoco_ros2_control_plugins

packages_remove_from_deps:

  # Use the conda-forge iceoryx 2.0.6 packages instead of rebuilding the ROS
  # release copies.
  - iceoryx_binding_c
  - iceoryx_hoofs
  - iceoryx_posh

  - if: not linux
    then:
      - pendulum_control
      - rttest
      - tlsf
      - tlsf_cpp

skip_existing:
  - https://prefix.dev/robostack-rolling/

