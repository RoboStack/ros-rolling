ros_distro: rolling

package_name_mode: both

# mapping for package keys
conda_index:
  - robostack.yaml
  - packages-ignore.yaml

# Reminder for next full rebuild, the next build number should be 28
build_number: 27

mutex_package:
  name: "ros2-distro-mutex"
  version: "0.20.0"
  build_number: 27
  upper_bound: "x.x"
  run_constraints:
    - libboost 1.90.*
    - libboost-devel 1.90.*
    - pcl 1.15.1.*
    - gazebo 11.*
    - libprotobuf 7.35.1.*
    - vtk 9.7.0.*

packages_skip_by_deps:
  - rplidar_ros
  - rviz_visual_tools

  # libpointmatcher not yet released for rolling; rtabmap builds fine without
  # it (WITH_POINTMATCHER just disables the optional dependent feature).
  - libpointmatcher

  - if: not linux
    then:
      - pendulum_control
      - rttest
      - tlsf
      - tlsf_cpp

  # mujoco_vendor has no prebuilt MuJoCo binary for macOS, so mujoco_3d_lidar (which
  # calls real MuJoCo API functions, unlike mujoco_ros2_control) can't build there.
  - if: osx
    then:
      - mujoco_3d_lidar

  # mujoco_ros2_control_plugins unconditionally requires
  # find_package(OpenGL REQUIRED COMPONENTS EGL) -- EGL doesn't exist on
  # Windows (or macOS, covered by the mujoco_vendor gap above) at all,
  # this is a genuine platform incompatibility, not a portability bug.
  - if: osx or win
    then:
      - mujoco_ros2_control_plugins

  # Ported from ros-humble-emscripten's vinca.yaml; transitively-pulled packages
  # not meant to build for wasm32. Re-verify against rolling's own closure later.
  - if: wasm32
    then:
      - rmw_connextdds
      - rmw_cyclonedds_cpp
      - rmw_fastrtps_cpp
      - rmw_fastrtps_dds_common
      - rmw_fastrtps_dynamic_cpp
      - rmw_fastrtps_shared_cpp
      # Native zenoh-c/zenoh-cpp RMW; we target zenoh-pico for wasm32 instead.
      - rmw_zenoh_cpp
      - ros_gz
      - ros_gz_bridge
      - ros_gz_image
      - ros_gz_sim
      - ros_gz_sim_demos
