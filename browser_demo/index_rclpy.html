<!doctype html>
<html>
<head><meta charset="utf-8"><title>wasm32 rclpy talker (rmw_zenoh_pico)</title></head>
<body>
<h1>wasm32 rclpy talker (rmw_zenoh_pico)</h1>
<pre id="log" style="white-space:pre-wrap;"></pre>
<script>
  const logEl = document.getElementById('log');
  var Module = {
    print: (t) => { console.log(t); logEl.textContent += t + "\n"; },
    printErr: (t) => { console.error(t); logEl.textContent += "[err] " + t + "\n"; },
    // See talker_rclc's index.html for why: zenohd's ws/ listener does a
    // plain upgrade with no Sec-WebSocket-Protocol negotiation, which real
    // browsers require a matching response for.
    websocket: { subprotocol: null },
  };
</script>
<script src="rclpy_boot.js"></script>
</body>
</html>
