  # Same resolvo mutex-misattribution bug as cartographer_ros above.
  add_host: ["ros2-pcl-conversions ==2.10.0 *_26"]
  add_run: ["ros2-pcl-conversions ==2.10.0 *_26"]
rmf_fleet_adapter_python:
  # pybind11_json is used for nlohmann::json <-> pybind11 conversions in the
  # bindings but isn't declared in package.xml (a rosdistro release gap);
  # header-only, so host-only is sufficient.
  add_host: ["pybind11_json"]
rmf_visualization_schedule:
  # Needed >=3.6.4 to build successfully on macOS during an earlier build
  # pass; package.xml itself declares openssl with no version constraint.
  remove_host: ["openssl"]
  remove_run: ["openssl"]
  # Same websocketpp/Boost.Asio io_service incompatibility as rmf_websocket
  # above -- this package also uses websocketpp::config::asio directly.
  # Pinned to 1.29.0 (the newest conda-forge build that still ships
  # io_service.hpp -- 1.30+ removed it too).
  add_host: ["openssl >=3.6.4", "asio ==1.29.0"]
  add_run: ["openssl >=3.6.4", "asio ==1.29.0"]
rmf_websocket:
  # websocketpp 0.8.2 requires boost::asio APIs (io_service et al.) that
  # Boost 1.90 removed; the patch defines ASIO_STANDALONE so websocketpp
  # uses the standalone asio instead, matching ros-lyrical's fix in
  # RoboStack/ros-lyrical#41. Pinned to 1.29.0 (the newest conda-forge
  # build that still ships io_service.hpp -- 1.30+ removed it too, same
  # underlying upstream deprecation that hit Boost.Asio).
  add_host: ["asio ==1.29.0"]
  add_run: ["asio ==1.29.0"]
