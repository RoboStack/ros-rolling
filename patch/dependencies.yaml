cartographer_ros:
  # package.xml's <depend>cartographer</depend> resolves to the REAL released
  # ros2-cartographer ROS package, but add_host below ALSO pulls in the
  # conda-forge cartographer C++ library directly -- vinca doesn't dedupe
  # these, so both end up in host/run with conflicting lua pins (conda-forge
  # cartographer wants lua 5.4.8, ros2-cartographer wants lua 5.5.0). Drop the
  # ROS-released one; the conda-forge add_host below is what's actually meant
  # to satisfy this dependency (see the pinocchio/hpp_fcl entry in build
  # feedback for the same generate_dummy_package_with_run_deps pattern).
  remove_host: ["ros2-cartographer"]
  remove_run: ["ros2-cartographer"]
  # resolvo mutex-misattribution bug: solver picks ros2-pcl-conversions 2.10.0's
  # OLDEST published build (mutex rolling_19) instead of the current one
  # (rolling_25) even though a matching-mutex build exists remotely. Same
  # pattern as the cv-bridge/libg2o entries elsewhere in this repo.
  add_host: ["cartographer 2.*", "libboost-devel", "ceres-solver * cpu*", "ros2-pcl-conversions ==2.10.0 *_26"]
  add_run: ["ros2-pcl-conversions ==2.10.0 *_26"]
