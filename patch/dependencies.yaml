mujoco_ros2_control_plugins:
  # package.xml's plain "opengl" rosdep only maps to libopengl-devel/libgl-devel
  # (robostack.yaml), but CMakeLists.txt does
  # find_package(OpenGL REQUIRED COMPONENTS EGL), which additionally needs
  # EGL's own headers/lib. conda-forge doesn't ship libegl-devel for win-64,
  # so restrict the addition to linux (this package is also selected there
  # per vinca.yaml's "not wasm32 and not osx" block).
  add_host:
    - if: linux
      then: ["libegl-devel"]
roboplan_ros_examples:
  # package.xml only declares ament_cmake_python, but CMakeLists.txt does
  # find_package(ament_cmake REQUIRED) and build_type is ament_cmake.
  # Fixed for roboplan_ros 0.7.0, so it can be removed when this releases.
  add_host: ["ros-rolling-ament-cmake"]
