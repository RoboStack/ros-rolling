[workspace]
name = "ros-rolling"
description = "RoboStack repo to package ros-rolling packages as conda packages"
authors = ["Tobias Fischer <tobias.fischer@qut.edu.au>", "Wolf Vollprecht <w.vollprecht@gmail.com>", "Silvio Traversaro <silvio@traversaro.it>", "Daisuke Nishimatsu <daisuke.nishimatsu1021@gmail.com>"]
channels = ["https://repo.prefix.dev/conda-forge"]
platforms = [
  "osx-arm64",
  # 2.17 is the glibc version used in CentOS 7
  { platform = "linux-64", glibc = "2.17" },
  "osx-64",
  { platform = "linux-aarch64", glibc = "2.17" },
  "win-64",
]

[dependencies]
python = ">=3.14.0,<3.15"
# Include the latest rattler-build fixes w.r.t. to patches handling
# rattler-build regression, pinning to 0.57
rattler-build = "<0.58.0"
cmake = "<4.0"
setuptools = "<82.0"
rattler-index = ">=0.27.16"

[target.win-64.dependencies]
# patch is required by rattler-build
m2-patch = "*"
# git is required by rattler-build
git = "*"

[pypi-dependencies]
# emscripten-wasm32 in platforms prevents pixi-build from resolving vinca as
# a conda source dep (uv is unavailable for that target), so use pypi here.
# Pinned to Tobias-Fischer/vinca#feature/emscripten-pthreads (PR open at
# https://github.com/RoboStack/vinca/pull/154) until merged upstream, then
# this should be re-pointed to the merged RoboStack/vinca commit. See that
# PR / ros-humble-emscripten's pixi.toml for the full rationale (emscripten
# 4.0.9 rejects -s DEMANGLE_SUPPORT=1; a v1-selector evaluation fix for
# pinning_overrides; real pthreads, since libc++'s condition_variable
# timed-wait never wakes up on its own without a real OS thread).
vinca = { git = "https://github.com/Tobias-Fischer/vinca.git", rev = "c974b23ab07dace8e5f67350601609903857c78d" }
# Uncomment this line to work with a local vinca for faster iteration, but remember to comment it back
# (and regenerate the pixi.lock) once you push the modified commit to the repo
# vinca = { path = "../vinca", editable = true }

[tasks]
generate-recipes = { cmd = "vinca -m", depends-on = ["remove-recipes"] }
generate-gha-workflows = { cmd = "vinca-gha --trigger-branch dummy_build_branch_as_it_is_unused -d ./recipes", depends-on = ["generate-recipes"] }
check-orphaned-patches = { cmd = "python check_orphaned_platform_patches.py", description = "Detect patch/ files vinca's add_package_name_variants() will never wire into any recipe because a same-package patch exists under a different name-prefix variant (see script docstring)." }
check-patches = { cmd = "python check_patches_clean_apply.py", depends-on = ["generate-recipes", "check-orphaned-patches"] }
create_snapshot = { cmd = "vinca-snapshot -d rolling -o rosdistro_snapshot.yaml" }
upload = "rattler-build upload prefix -c robostack-rolling --generate-attestation"
build_continue_on_failure = { cmd = "rattler-build build --recipe-dir ./recipes -m ./conda_build_config.yaml -c https://repo.prefix.dev/robostack-rolling -c https://repo.prefix.dev/conda-forge --continue-on-failure --skip-existing --channel-priority disabled", depends-on = ["generate-recipes"] }
sort = "sh -lc 'vinca-sort-vinca-lists $@ vinca.yaml && vinca-sort-yaml-keys $@ pkg_additional_info.yaml robostack.yaml rosdistro_additional_recipes.yaml' --"

generate-recipes-emscripten = { cmd = "vinca -m --platform emscripten-wasm32 && cp -r extra_recipes/. recipes/", depends-on = ["remove-recipes"] }
check-patches-emscripten = { cmd = "python check_patches_clean_apply.py", depends-on = ["generate-recipes-emscripten"] }

# No native (osx-arm64) build of any ros2-*-prefixed package is published
# anywhere (not on robostack-staging, not on robostack-rolling, not built
# locally) -- yet several message packages' generated recipe.yaml still
# declares a build:-time (i.e. resolved against build_platform, not
# target_platform) dependency on a native copy of
# ros2-rosidl-default-generators, since CMake's find_package() for it runs
# via the build-platform toolchain during cross-compilation. That native
# copy is otherwise permanently unsatisfiable for this closure. The
# host-prefix (emscripten-wasm32) copy already suffices for CMake's own
# find_package() resolution (via -DCMAKE_FIND_ROOT_PATH=$PREFIX,
# already set in build_ament_cmake.sh.in) -- rattler-build's solver just
# also insists on satisfying the *declared* build: requirement against a
# real build_platform (osx-arm64 here) channel entry. Mirroring the
# already-built emscripten-wasm32 packages into a same-named osx-arm64
# channel dir and reindexing satisfies the solver with zero actual native
# rebuilding. Re-run this after each build pass that produces new
# emscripten-wasm32 packages -- packages built *during* the same pass
# aren't visible to the mirror until it's resynced, so the standard
# workflow is: build pass -> sync-native-bootstrap-mirror -> build pass
# (repeat until nothing new gets built) -> the scoped _Event-gap rebuilds
# documented on build-emscripten below.
sync-native-bootstrap-mirror = { cmd = "mkdir -p output/osx-arm64 && cp output/emscripten-wasm32/*.tar.bz2 output/osx-arm64/ && rattler-index fs output", description = "Mirror built emscripten-wasm32 packages into a fake osx-arm64 channel entry, satisfying the build:-time native rosidl_default_generators dependency some message recipes declare (see comment above) without an actual native build." }

[tasks.build]
cmd = "rattler-build build --recipe-dir ./recipes -m ./conda_build_config.yaml -c https://prefix.dev/robostack-rolling -c https://prefix.dev/conda-forge --skip-existing --channel-priority disabled"
depends-on = ["generate-recipes"]
description = "Build all packages, from the ./recipes dir. This will skip already existing packages, so it can be used to build only a subset of packages by first removing the recipes of the packages you want to rebuild (see `pixi remove-recipes`)."

[tasks.remove-recipes]
cmd = "rm -rf recipes_only_patch; rm -rf recipes; mkdir recipes"
description = "Remove all generated recipes, before regenerating them."

[tasks.build-one]
cmd = "cp ./patch/{{ PACKAGE }}.*patch ./recipes/{{ PACKAGE }}/patch/; rattler-build build --recipe ./recipes/{{ PACKAGE }}/recipe.yaml -m ./conda_build_config.yaml -c https://prefix.dev/robostack-rolling -c https://prefix.dev/conda-forge --channel-priority disabled"
args = [{ arg = "PACKAGE", default = "ros-rolling-ros-workspace" }]
description = "Build a single package, from the ./recipes dir. Add the `ros-rolling-` prefix to the package name, e.g. `pixi build-one --package ros-rolling-ros-workspace`"

[tasks.build-emscripten]
  cmd = [
      "rattler-build", "build",
      "--package-format", "tar-bz2",
      "--recipe-dir", "./recipes",
      "-m", "./conda_build_config.yaml",
      "-c", "https://repo.prefix.dev/conda-forge",
      # https://repo.mamba.pm/emscripten-forge is stale/legacy -- emscripten-forge/recipes'
      # own pixi.toml publishes the emscripten SDK + cross-python toolchain to this
      # channel instead. See ros-humble-emscripten's pixi.toml for details.
      "-c", "https://repo.prefix.dev/emscripten-forge-4x",
      # emscripten-forge-4x publishes the emscripten SDK toolchain package, but not
      # (yet) cross-python_emscripten-wasm32 -- built locally instead from a clone
      # of emscripten-forge/recipes (its own `build-cross-python-pkg` task), same
      # as ros-humble-emscripten needed. TODO: drop this once/if emscripten-forge
      # publishes it upstream, or vendor the build step into this repo properly.
      "-c", "file:///tmp/emscripten_forge_recipes/output",
      "-c", "microsoft",
      "-c", "robostack-staging",
      "--target-platform", "emscripten-wasm32",
      "--skip-existing",
      "--test", "skip",
      # Without this, strict channel priority prefers conda-forge's newer
      # noarch-eligible pyyaml (6.0.2/6.0.3, needing a "yaml" package that
      # doesn't exist on any channel here) over emscripten-forge-4x's own
      # pyyaml 6.0 build (needing "libyaml", which does exist for
      # emscripten-wasm32) purely because conda-forge is listed first --
      # even though conda-forge itself never publishes emscripten-wasm32
      # builds. Confirmed necessary 2026-09-08 resolving ros2-launch's
      # pyyaml dependency. Matches build-one's existing convention.
      "--channel-priority", "disabled",
      # rosidl_typesupport_microxrcedds_cpp's codegen doesn't handle ROS 2's
      # newer auto-generated service "_Event" messages (real upstream gap,
      # not fixable by a dependency declaration) -- action_msgs,
      # lifecycle_msgs, rosgraph_msgs, statistics_msgs, micro_ros_msgs, and
      # (via rcl's build/test dep on it) test_msgs all define such a
      # service and fail to build with VINCA_EMSCRIPTEN_STATIC_TYPESUPPORT_CPP
      # forcing that backend globally below. example_interfaces doesn't
      # define one itself but needs the same microxrcedds host deps as
      # test_msgs (see patch/dependencies.yaml) to stay consistent with the
      # rest of the closure. Same rationale as build_continue_on_failure's
      # own --continue-on-failure for the native build: let these fail here
      # (they fall back to introspection-only typesupport on a follow-up
      # rebuild without the CPP override -- see this repo's README) rather
      # than aborting the whole closure. IMPORTANT: this "no override"
      # rebuild is only correct for packages rmw_zenoh_pico doesn't itself
      # need the C backend for -- do NOT route rcl_interfaces,
      # type_description_interfaces or service_msgs through it (see the
      # "Known gap" comment on the env= line below): a no-override build of
      # those three "succeeds" but silently leaves their
      # rosidl_typesupport_c dispatch table pointing at introspection, not
      # microxrcedds, which is the exact class of bug this whole env= var
      # exists to prevent (confirmed 2026-09-10, found via
      # `strings ... | grep get_message_type_support_handle` on a build
      # that had gone through this branch by mistake).
      "--continue-on-failure"
      ]
  depends-on = ["generate-recipes-emscripten", "sync-native-bootstrap-mirror"]
  # Read by vinca's build_ament_cmake.sh.in (see the vinca fork commits
  # b504063 and 235bd2f): rmw_implementation's get_default_rmw_implementation()
  # needs a real, buildable RMW name here -- this repo builds rmw_zenoh_pico,
  # not ros-humble-emscripten's rmw_wasm_cpp. rmw_zenoh_pico (a
  # micro-ROS-lineage RMW) also hard-requires every message's
  # rosidl_typesupport_c/cpp dispatch table to register the
  # rosidl_typesupport_microxrcedds_c/cpp backend specifically -- the
  # default (rosidl_typesupport_introspection_c/cpp, what rmw_wasm_cpp
  # expects) leaves that dispatch table without a matching entry at all,
  # so rcl_publisher_init fails with "Type support not from this
  # implementation" for every message type regardless of what's linked at
  # the final executable. Confirmed via live browser demo, 2026-09-09.
  #
  # Known gap: rosidl_typesupport_microxrcedds_cpp's codegen doesn't handle
  # ROS 2's newer auto-generated service "_Event" messages, so any message
  # package that transitively pulls one in fails to build with
  # STATIC_ROSIDL_TYPESUPPORT_CPP set this way (confirmed 2026-09-09 getting
  # a live rclpy demo running; test_msgs confirmed 2026-09-10, pulled in as
  # a real build/test_depend of rcl so it's non-optional for the closure).
  # Building this closure end-to-end in one `pixi run build-emscripten` pass
  # therefore still needs a per-package override this repo doesn't have yet
  # (vinca's env vars here are global to the whole invocation) -- for now
  # the affected packages are rebuilt by hand afterwards, split into two
  # DISJOINT groups (do not run a package through both -- see the
  # --continue-on-failure comment above for why that matters):
  #   - action_msgs, lifecycle_msgs, rosgraph_msgs, statistics_msgs,
  #     micro_ros_msgs, test_msgs, example_interfaces: rebuild with NO
  #     override at all (falls back to introspection for both C and C++ --
  #     correct for these, since nothing downstream needs their C backend
  #     specifically).
  #   - rcl_interfaces, type_description_interfaces, service_msgs: rmw_zenoh_pico
  #     needs the C backend from these three specifically, so rebuild them
  #     DIRECTLY with only VINCA_EMSCRIPTEN_STATIC_TYPESUPPORT_C set (not a
  #     separate no-override pass first) -- leaving CPP unset makes it fall
  #     back to introspection_cpp, which sidesteps the _Event gap same as
  #     the first group, while still getting the correct C backend these
  #     three actually need wired into their typesupport dispatch table.
  # See browser_demo/build_rclpy.sh (local-only, not part of this repo) for
  # the exact rclpy verification this was found through.
  env = { VINCA_EMSCRIPTEN_RMW_IMPLEMENTATION = "rmw_zenoh_pico", VINCA_EMSCRIPTEN_STATIC_TYPESUPPORT_C = "rosidl_typesupport_microxrcedds_c", VINCA_EMSCRIPTEN_STATIC_TYPESUPPORT_CPP = "rosidl_typesupport_microxrcedds_cpp" }
